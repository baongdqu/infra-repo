apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - servicemonitor-backend.yaml
  - alert-rules.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack

configMapGenerator:
  - name: grafana-dashboard-app-metrics
    files:
      - grafana-dashboards/app-metrics-dashboard.json
  - name: grafana-dashboard-loki-logs
    files:
      - grafana-dashboards/loki-logs-dashboard.json

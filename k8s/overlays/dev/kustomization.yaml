apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  # Bỏ comment dòng dưới sau khi chạy seal-secrets.ps1 seal để nạp app-secrets đã mã hóa:
  # - sealed-secret.yaml

labels:
  - pairs:
      env: dev
    includeSelectors: false

images:
  - name: ghcr.io/baongdqu/app-repo/frontend
    newTag: sha-initial
  - name: ghcr.io/baongdqu/app-repo/backend
    newTag: sha-initial

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: app-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.REPLACE_LB_IP.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.REPLACE_LB_IP.nip.io

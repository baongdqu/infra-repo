# Template structure for aiops-bot-secrets (DO NOT commit real secrets here)
apiVersion: v1
kind: Secret
metadata:
  name: aiops-bot-secrets
  namespace: aiops
type: Opaque
stringData:
  GEMINI_API_KEY: "<GEMINI_API_KEY>"
  TELEGRAM_BOT_TOKEN: "<TELEGRAM_BOT_TOKEN>"
  TELEGRAM_CHAT_ID: "<TELEGRAM_CHAT_ID>"
  DISCORD_WEBHOOK_URL: "<DISCORD_WEBHOOK_URL>"

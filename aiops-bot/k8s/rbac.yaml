apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-bot
  namespace: aiops
  labels:
    app: aiops-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-bot-reader
  labels:
    app: aiops-bot
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-bot-reader-binding
  labels:
    app: aiops-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiops-bot-reader
subjects:
  - kind: ServiceAccount
    name: aiops-bot
    namespace: aiops
